<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#0a0c0e"/>
  
  <!-- Stylized "A" for Abhyas - strong, geometric, fitness-focused -->
  <g fill="#22c55e">
    <!-- Left leg of A -->
    <path d="M 160 390 L 200 150 L 240 150 L 200 390 Z"/>
    
    <!-- Right leg of A -->
    <path d="M 272 150 L 312 150 L 352 390 L 312 390 Z"/>
    
    <!-- Crossbar -->
    <rect x="200" y="260" width="112" height="30" rx="4"/>
    
    <!-- Top cap (peak of A) -->
    <path d="M 226 120 L 256 90 L 286 120 L 272 150 L 240 150 Z"/>
  </g>
  
  <!-- Bottom accent - represents foundation/strength -->
  <rect x="160" y="410" width="192" height="8" rx="4" fill="#16a34a"/>
</svg>
