name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build:
    name: lint-typecheck-build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify test shard coverage
        run: npm run verify-test-shards

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0

      - name: Test built service worker output
        run: npm run test:sw-built-output
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0

      - name: Test sitemap and robots routes
        run: npm run test:sitemap-route
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0

  test-shard-1:
    name: test (shard 1/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test shard 1
        run: npm run test:shard1

  test-shard-2:
    name: test (shard 2/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test shard 2
        run: npm run test:shard2

  test-shard-3:
    name: test (shard 3/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test shard 3
        run: npm run test:shard3

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-typecheck-build, test-shard-1, test-shard-2, test-shard-3]
    if: always()

    steps:
      - name: Check all required jobs succeeded
        run: |
          echo "Checking results of all required jobs..."
          echo "lint-typecheck-build: ${{ needs.lint-typecheck-build.result }}"
          echo "test-shard-1: ${{ needs.test-shard-1.result }}"
          echo "test-shard-2: ${{ needs.test-shard-2.result }}"
          echo "test-shard-3: ${{ needs.test-shard-3.result }}"
          
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ At least one job failed"
            exit 1
          fi
          
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ At least one job was cancelled"
            exit 1
          fi
          
          if [[ "${{ contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "❌ At least one job was skipped"
            exit 1
          fi
          
          echo "✅ All required jobs succeeded"

  database-seed-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: v2.122.0

      - name: Override auth config for CI
        run: |
          # Override production auth settings for local testing only
          sed -i 's|site_url = "https://abhyas-indol.vercel.app"|site_url = "http://localhost:3000"|' supabase/config.toml
          sed -i 's|enable_signup = false|enable_signup = true|' supabase/config.toml
          sed -i 's|enable_confirmations = true|enable_confirmations = false|' supabase/config.toml
          sed -i 's|max_frequency = "1m0s"|max_frequency = "1s"|' supabase/config.toml

      - name: Start Supabase local stack
        run: supabase start
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

      - name: Run database reset with seed
        run: supabase db reset

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0

      - name: Test proxy routes (strict, with local Supabase)
        run: npm run test:proxy-routes
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0

      - name: Verify seed data
        run: |
          # Query the database to verify seed data was loaded correctly
          supabase db query "
            DO \$\$
            DECLARE
              test_user_count INT;
              test_program_count INT;
              test_program_day_count INT;
              upper_a_exercises INT;
              lower_a_exercises INT;
              upper_b_exercises INT;
              lower_b_exercises INT;
              test_session_count INT;
              test_session_sets INT;
              test_exercise_progress INT;
            BEGIN
              -- Check test user exists
              SELECT COUNT(*) INTO test_user_count 
              FROM auth.users 
              WHERE id = '00000000-0000-0000-0000-000000000001';
              
              IF test_user_count != 1 THEN
                RAISE EXCEPTION 'Expected 1 test user, found %', test_user_count;
              END IF;
              
              -- Check program exists
              SELECT COUNT(*) INTO test_program_count 
              FROM programs 
              WHERE user_id = '00000000-0000-0000-0000-000000000001' AND status = 'active';
              
              IF test_program_count != 1 THEN
                RAISE EXCEPTION 'Expected 1 active program, found %', test_program_count;
              END IF;
              
              -- Check all program days exist (4 weights + 3 rest = 7 total)
              SELECT COUNT(*) INTO test_program_day_count 
              FROM program_days pd 
              JOIN programs p ON pd.program_id = p.id 
              WHERE p.user_id = '00000000-0000-0000-0000-000000000001';
              
              IF test_program_day_count != 7 THEN
                RAISE EXCEPTION 'Expected 7 program days, found %', test_program_day_count;
              END IF;
              
              -- Check Upper A has 5 exercises
              SELECT COUNT(*) INTO upper_a_exercises 
              FROM program_day_exercises pde 
              JOIN program_days pd ON pde.program_day_id = pd.id 
              JOIN programs p ON pd.program_id = p.id 
              WHERE p.user_id = '00000000-0000-0000-0000-000000000001' 
              AND pd.label = 'Upper A';
              
              IF upper_a_exercises != 5 THEN
                RAISE EXCEPTION 'Expected 5 Upper A exercises, found %', upper_a_exercises;
              END IF;
              
              -- Check Lower A has 5 exercises
              SELECT COUNT(*) INTO lower_a_exercises 
              FROM program_day_exercises pde 
              JOIN program_days pd ON pde.program_day_id = pd.id 
              JOIN programs p ON pd.program_id = p.id 
              WHERE p.user_id = '00000000-0000-0000-0000-000000000001' 
              AND pd.label = 'Lower A';
              
              IF lower_a_exercises != 5 THEN
                RAISE EXCEPTION 'Expected 5 Lower A exercises, found %', lower_a_exercises;
              END IF;
              
              -- Check Upper B has 5 exercises
              SELECT COUNT(*) INTO upper_b_exercises 
              FROM program_day_exercises pde 
              JOIN program_days pd ON pde.program_day_id = pd.id 
              JOIN programs p ON pd.program_id = p.id 
              WHERE p.user_id = '00000000-0000-0000-0000-000000000001' 
              AND pd.label = 'Upper B';
              
              IF upper_b_exercises != 5 THEN
                RAISE EXCEPTION 'Expected 5 Upper B exercises, found %', upper_b_exercises;
              END IF;
              
              -- Check Lower B has 5 exercises
              SELECT COUNT(*) INTO lower_b_exercises 
              FROM program_day_exercises pde 
              JOIN program_days pd ON pde.program_day_id = pd.id 
              JOIN programs p ON pd.program_id = p.id 
              WHERE p.user_id = '00000000-0000-0000-0000-000000000001' 
              AND pd.label = 'Lower B';
              
              IF lower_b_exercises != 5 THEN
                RAISE EXCEPTION 'Expected 5 Lower B exercises, found %', lower_b_exercises;
              END IF;
              
              -- Check completed session exists
              SELECT COUNT(*) INTO test_session_count 
              FROM sessions 
              WHERE user_id = '00000000-0000-0000-0000-000000000001' AND status = 'completed';
              
              IF test_session_count < 1 THEN
                RAISE EXCEPTION 'Expected at least 1 completed session, found %', test_session_count;
              END IF;
              
              -- Check session has 4 bench press sets
              SELECT COUNT(*) INTO test_session_sets 
              FROM session_sets ss 
              JOIN session_exercises se ON ss.session_exercise_id = se.id 
              JOIN sessions s ON se.session_id = s.id 
              JOIN exercises e ON se.exercise_id = e.id 
              WHERE s.user_id = '00000000-0000-0000-0000-000000000001' 
              AND e.slug = 'barbell-bench-press-medium-grip';
              
              IF test_session_sets != 4 THEN
                RAISE EXCEPTION 'Expected 4 bench press sets, found %', test_session_sets;
              END IF;
              
              -- Check exercise progress has 6 exercises
              SELECT COUNT(*) INTO test_exercise_progress 
              FROM exercise_progress 
              WHERE user_id = '00000000-0000-0000-0000-000000000001';
              
              IF test_exercise_progress != 6 THEN
                RAISE EXCEPTION 'Expected 6 exercise progress records, found %', test_exercise_progress;
              END IF;
              
              -- Test partial unique index: one in_progress session per user
              -- First, ensure no in_progress sessions exist for test user
              DELETE FROM sessions 
              WHERE user_id = '00000000-0000-0000-0000-000000000001' 
              AND status = 'in_progress';
              
              -- Insert first in_progress session (should succeed)
              INSERT INTO sessions (user_id, local_date, status, planned_type, actual_type)
              VALUES ('00000000-0000-0000-0000-000000000001', '2026-10-24', 'in_progress', 'weights', 'weights');
              
              -- Attempt to insert second in_progress session for same user (should fail with 23505)
              BEGIN
                INSERT INTO sessions (user_id, local_date, status, planned_type, actual_type)
                VALUES ('00000000-0000-0000-0000-000000000001', '2026-10-25', 'in_progress', 'weights', 'weights');
                
                -- If we reach here, the constraint didn't fire
                RAISE EXCEPTION 'Expected duplicate in_progress session to fail with 23505, but it succeeded';
              EXCEPTION
                WHEN unique_violation THEN
                  -- Expected: 23505 unique_violation
                  RAISE NOTICE 'Correctly rejected duplicate in_progress session with 23505';
              END;
              
              -- Verify a completed session for the same user is still allowed
              INSERT INTO sessions (user_id, local_date, status, planned_type, actual_type)
              VALUES ('00000000-0000-0000-0000-000000000001', '2026-10-25', 'completed', 'weights', 'weights');
              
              RAISE NOTICE 'All seed validation checks passed!';
            END \$\$;
          "

      - name: Run exercise history real-DB tests
        run: |
          # Get service role key from Supabase status
          # Extract the key and remove surrounding quotes
          export SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d '=' -f 2- | tr -d '"')
          echo "Service role key configured (first 20 chars): ${SUPABASE_SERVICE_ROLE_KEY:0:20}..."
          npm run test:exercise-history-real-db
          npm run test:progress-rpcs-real-db
          npm run test:progress-active-days
          npm run test:superseded-override
          npm run test:first-build-ended-on
          npm run test:equipment-two-client
          npm run test:injuries-two-client
          npm run test:stale-stash-two-client
          npm run test:swap-prefill-real-db
          npm run test:ended-early-real-db
          npm run test:abandon-end-early-real-db
          npm run test:session-summary-real-db
          npm run test:resolve-swap-weights-real-db
          npm run test:swap-guard-real-db
          npm run test:ensure-session-exercises-deload
          npm run test:start-session-ensure-exercises
          npx tsx scripts/test-delete-set.ts
          npx tsx scripts/test-skipped-session-shapes.ts
          REAL_DB=1 npm run test:history-edit-validation-db
          REAL_DB=1 npm run test:unique-planned-session-migration-real-db
          REAL_DB=1 npm run test:gym-tenant-rls-real-db
          REAL_DB=1 npm run test:gym-owner-guards-sql
          REAL_DB=1 npm run ci:mutant-gym-rls-policies
          REAL_DB=1 npm run test:gym-domains-real-db
          REAL_DB=1 npm run ci:mutant-gym-domains
          REAL_DB=1 npm run test:migration-040-idempotent
          REAL_DB=1 npm run test:gym-branding-real-db
          REAL_DB=1 npm run ci:mutant-gym-branding
        env:
          REAL_DB: "1"

      - name: Stop Supabase
        if: always()
        run: supabase stop

  block-range-db-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abhyas_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run block range DB tests
        run: |
          npm run test:block-range-db
          npm run test:block-range-cleanup
          npm run test:block-range-db-followup
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/abhyas_test

      - name: Run e1RM formula DB tests
        run: npx tsx scripts/test-e1rm-formula-db.ts
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/abhyas_test
          REQUIRE_DB: "1"

      - name: Run e1RM formula mutant tests
        run: bash scripts/test-e1rm-formula-mutants.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/abhyas_test
          REQUIRE_DB: "1"
